<script>
{
const app=document.getElementById('app');
const store={get(k){try{return JSON.parse(localStorage.getItem('hb-'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('hb-'+k,JSON.stringify(v))}catch(e){}}};
const LANGS=[['sk','Slovenčina'],['cz','Čeština'],['en','English'],['de','Deutsch'],['fr','Français'],['es','Español'],['it','Italiano'],['pt','Português'],['pl','Polski'],['hu','Magyar'],['uk','Українська'],['ro','Română'],['nl','Nederlands'],['th','ไทย'],['fil','Filipino']],LCODES=LANGS.map(x=>x[0]);
const detectLang=()=>{const s=store.get('lang');if(LCODES.includes(s))return s;
 for(const n of (navigator.languages||[navigator.language||''])){const c=String(n).toLowerCase().split('-')[0];const m={cs:'cz',tl:'fil',fil:'fil'}[c]||c;if(LCODES.includes(m))return m}return 'en'};
let lang=detectLang();
let T=[];
const later=(f,ms)=>{const id=setTimeout(f,ms);T.push(id);return id};
const cleanup=()=>{T.forEach(clearTimeout);T=[];running=false};
/* anti-cheat: flags collected during one run */
let running=false,flags=new Set();
const flag=k=>{if(running)flags.add(k)};
const gaps=ts=>ts.slice(1).map((t,i)=>t-ts[i]);

 const fb=()=>{let ta=btn.parentElement.querySelector('textarea.cp');if(!ta){ta=document.createElement('textarea');ta.className='cp';ta.readOnly=true;btn.parentElement.appendChild(ta)}ta.value=text;ta.select()};

 <p class=err id=everr></p><button class="btn red">${ps('create')}</button></form></div></section>`;
 const f=el('evf');
 f.onsubmit=e=>{e.preventDefault();const d=new FormData(f),tests=d.getAll('t');if(!tests.length){el('everr').textContent=ps('needTest');return}
  EV={id:Date.now(),name:d.get('name').trim(),place:d.get('place').trim(),proctor:d.get('proctor').trim(),pin:d.get('pin'),tests,tries:+d.get('tries'),rule:d.get('rule'),practice:!!d.get('practice'),lag:Math.max(0,+d.get('lag')||0),date:today()};

function ranked(list){const rk={};
 EV.tests.map(byId).forEach(t=>{const vals=list.map(s=>s.res[t.id]?.final).filter(v=>v!=null);
  list.forEach(s=>{const v=s.res[t.id]?.final;if(v==null)return;(rk[s.id]=rk[s.id]||[]).push(vals.filter(x=>t.low?x<v:x>v).length+1)})});
 return list.map(s=>({s,m:rk[s.id]?rk[s.id].reduce((a,b)=>a+b,0)/rk[s.id].length:999})).sort((a,b)=>a.m-b.m).map(r=>r.s)}
function csv(list,tests){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 return [[ps('nameH'),ps('ageH'),ps('bornH'),ps('idH'),...tests.map(t=>L(t.name)+' ('+L(t.u)+')'),ps('code')].map(q).join(';'),
  ...list.map(s=>[s.name,s.age,s.by,s.idOk?1:0,...tests.map(t=>{const v=s.res[t.id]?.final;return v==null?'':dec(v)}),s.code].map(q).join(';'))].join('\n')}

function dash(){cleanup();const tests=EV.tests.map(byId),list=ranked(evSessions());
 app.innerHTML=`<section class="band testhead"><div class=wrap><a href="#" class=back>← ${tx('back')}</a><h1>${esc(EV.name)}</h1>

 <div class=row style="justify-content:flex-start;margin-top:16px"><button class="btn red" id=newp>${ps('newP')}</button><button class="btn line" id=cpy>${ps('copyCsv')}</button></div></div></section>
 <section class=band><div class=wrap><h2>${ps('board')} (${list.length})</h2>
 ${list.length?`<div class=scroll><table class=res><thead><tr><th>#</th><th>${ps('nameH')}</th><th class=n>${ps('ageH')}</th>${tests.map(t=>`<th class=n>${L(t.name)}</th>`).join('')}<th></th></tr></thead><tbody>${list.map((s,i)=>`<tr><td>${i+1}.</td><td><b>${esc(s.name)}</b>${s.idOk?'':` <small class=mut>(${ps('noId')})</small>`}</td><td class=n>${s.age}</td>${tests.map(t=>`<td class=n>${fmtv(t,s.res[t.id]?.final)}</td>`).join('')}<td><button class="btn line sm" data-c="${s.id}">${ps('cert')}</button></td></tr>`).join('')}</tbody></table></div><p class=mut>${ps('rankNote')}</p>`:`<p class=mut>${ps('empty')}</p>`}

function register(){
 app.innerHTML=`<section class="band testhead"><div class=wrap><a href="#dohlad" class=back id=bk>← ${esc(EV.name)}</a><h1>${ps('newP')}</h1></div></section>
 <section class=band><div class=wrap><form class=pform id=rf>

 <label>${ps('bornH')}<input name=by required type=number min=1900 max=${new Date().getFullYear()} inputmode=numeric></label>
 <label class=chk><input type=checkbox name=id>${ps('idOk')}</label>
 <label class=chk><input type=checkbox name=ok required>${ps('consent')}</label>
 <label>${ps('pinStart')}<input name=pin type=password required inputmode=numeric autocomplete=off></label>

 el('bk').onclick=e=>{e.preventDefault();dash()};

 f.onsubmit=e=>{e.preventDefault();const d=new FormData(f);if(d.get('pin')!==EV.pin){el('rerr').textContent=ps('badPin');return}
  const by=+d.get('by');
  P={id:Date.now(),name:d.get('name').trim(),by,age:new Date().getFullYear()-by,idOk:!!d.get('id'),res:{},ti:0,k:0,ph:'intro',pr:false,note:'',nav:0,done:false,date:today()};

const adj=(t,v)=>LAGT.includes(t.id)&&EV.lag?Math.max(0,v-EV.lag):v;
function step(){cleanup();const t=byId(EV.tests[P.ti]),n=EV.tests.length,tr=P.res[t.id]?.tries||[],last=tr[tr.length-1];
 app.innerHTML=`<div class=ptop><span>${esc(P.name)} · ${ps('testN').replace('{i}',P.ti+1).replace('{n}',n)}: ${L(t.name)}</span><span>${ps('tryN').replace('{i}',P.k+1).replace('{n}',EV.tries)}</span></div>
 <div id=arena class=arena></div>
 <section class=band><div class=wrap><details class=dz><summary>${ps('proctorPanel')}</summary><div class=pinrow><input type=password inputmode=numeric placeholder="PIN" id=pinA aria-label="PIN"><button class="btn line" id=abort>${ps('abort')}</button><span class=err id=pa></span></div></details></div></section>`;
 el('abort').onclick=()=>{if(el('pinA').value!==EV.pin){el('pa').textContent=ps('badPin');return}P=null;exitFs();dash()};
 const a=el('arena');
 if(P.ph==='flag'){
  a.innerHTML=`<div class=sus><b>${ps('flagged')}</b>${last.fl.map(k=>`<span>${tx('f_'+k)}</span>`).join('')}</div><p>${ps('flagHelp')}</p>
  <div class=pinrow style="justify-content:center"><input type=password inputmode=numeric placeholder="PIN" id=pinF aria-label="PIN"><button class=btn id=acc>${ps('accept')}</button><button class="btn ghost" id=rep>${ps('repeat')}</button></div><p class=err id=pf></p>`;
  const chk=()=>{if(el('pinF').value!==EV.pin){el('pf').textContent=ps('badPin');return false}return true};
  el('acc').onclick=()=>{if(!chk())return;last.ok=true;advance(t)};
  el('rep').onclick=()=>{if(!chk())return;tr.pop();P.ph=P.k?'between':'intro';step()};
  return}
 if(P.ph==='between'){
  a.innerHTML=`<p class=lbl>${ps('tryDone')}</p><div class=huge>${fmt(t,last.v)}</div>${last.d?`<p>${esc(last.d)}</p>`:''}<button class=btn id=gob>${ps('nextTry')}</button>`}
 else{
  a.innerHTML=`<div class=intro><div class="glyph big">${t.g}</div><div class=big>${L(t.name)}</div><p>${L(t.desc)}</p>${P.note?`<p class=lbl>${esc(P.note)}</p>`:''}
  <div class=row>${EV.practice&&!P.pr?`<button class="btn ghost" id=prb>${ps('practiceB')}</button>`:''}<button class=btn id=gob>${ps('official')}</button></div></div>`;
  const prb=el('prb');if(prb)prb.onclick=()=>runTest(t,v=>{P.pr=true;P.note=ps('prDone')+': '+fmt(t,adj(t,v));step()})}
 el('gob').onclick=()=>runTest(t,(v,d,fl)=>{const r=P.res[t.id]=P.res[t.id]||{tries:[]};r.tries.push({v:adj(t,v),d,fl,ok:!fl.length});
  if(fl.length){P.ph='flag';step()}else advance(t)})}

function advance(t){P.k++;
 if(P.k<EV.tries){P.ph='between';return step()}
 const r=P.res[t.id],vs=r.tries.filter(x=>x.ok).map(x=>x.v);
 r.final=EV.rule==='best'?(t.low?Math.min(...vs):Math.max(...vs)):Math.round(vs.reduce((a,b)=>a+b,0)/vs.length*10)/10;
 P.ti++;P.k=0;P.pr=false;P.note=ps('lastRes')+' ('+L(t.name)+'): '+fmt(t,r.final);
 if(P.ti<EV.tests.length){P.ph='intro';return step()}
 done2()}

async function codeOf(o){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(o)));const h=[...new Uint8Array(b)].slice(0,5).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();return h.slice(0,5)+'-'+h.slice(5)}catch(e){return o.id.toString(36).toUpperCase()}}
async function done2(){P.done=true;exitFs();
 const rec={id:P.id,ev:EV.id,evName:EV.name,place:EV.place,proctor:EV.proctor,date:P.date,name:P.name,by:P.by,age:P.age,idOk:P.idOk,nav:P.nav,
  res:Object.fromEntries(Object.entries(P.res).map(([k,r])=>[k,{final:r.final,tries:r.tries.map(x=>({v:x.v,fl:x.fl,ok:x.ok}))}]))};
 rec.code=await codeOf(rec);store.set('sessions',[...sessions(),rec]);P=null;cert(rec)}

function cert(s){cleanup();const tests=Object.keys(s.res).map(byId).filter(Boolean),anyF=tests.some(t=>s.res[t.id].tries.some(x=>x.fl.length));
 app.innerHTML=`<section class=band><div class=wrap><div class=cert>
 <div class=ch><span class=flag aria-hidden=true></span><b>${tx('title')}</b></div>
 <p class=ctag>${ps('certTitle')}</p><h2 class=cname>${esc(s.name)}</h2>
 <p>${ps('bornH')}: ${s.by} · ${ps('ageH')}: ${s.age}<br>${[s.evName,s.place,s.date].filter(Boolean).map(esc).join(' · ')}</p>
 <div class=scroll><table class=res><thead><tr><th>${ps('testH')}</th><th class=n>${ps('resH')}</th><th class=n>${ps('triesH')}</th></tr></thead><tbody>${tests.map(t=>{const r=s.res[t.id];return `<tr><td>${L(t.name)}</td><td class=n><b>${fmtv(t,r.final)}</b></td><td class=n>${r.tries.map(x=>(x.fl.length?'⚑ ':'')+dec(x.v)).join(' · ')}</td></tr>`}).join('')}</tbody></table></div>
 ${anyF?`<p class=cnote>⚑ ${ps('accMark')}</p>`:''}
 <p>${ps('proctoredBy')}: <b>${esc(s.proctor)}</b>${s.idOk?' · '+ps('idOkS'):''}${s.nav?' · '+ps('navS')+': '+s.nav:''}</p>
 <p class=code>${ps('code')}: ${esc(s.code)}</p><p class=cnote>${ps('certNote')}</p></div>
 <div class=row style="margin-top:18px"><button class="btn red" id=cc>${ps('copyCert')}</button><button class="btn line" id=bd>${ps('backEv')}</button></div></div></section>`;
 el('cc').onclick=e=>copyOut(certText(s,tests),e.currentTarget);
 el('bd').onclick=()=>EV?dash():setup()}

const rs=k=>(RS[lang]&&RS[lang][k])??RS.en?.[k]??RS.sk[k];
const MINP=30;
const sportOf=t=>SP[t.id];
const LANG_ONLY={skcz:['sk','cz'],vybrane:['sk','cz']},LANG_NOT={anagramy:['th']};
const langOk=t=>(!LANG_ONLY[t.id]||LANG_ONLY[t.id].includes(lang))&&!(LANG_NOT[t.id]||[]).includes(lang);
const visibleTests=()=>(Object.keys(SP).length?TESTS.filter(t=>SP[t.id]&&SP[t.id].active!==false):TESTS).filter(langOk);
const defDev=()=>{try{return matchMedia('(pointer: coarse)').matches?'touch':'mouse'}catch(e){return 'mouse'}};
const isStaff=()=>!!(ME&&['moderator','superadmin'].includes(ME.role));
const AGEG=['do 17','18–24','25–34','35–44','45–54','55–64','65+'];
const ageGroup=by=>{if(!by)return null;const a=new Date().getFullYear()-by;return a<18?AGEG[0]:a<25?AGEG[1]:a<35?AGEG[2]:a<45?AGEG[3]:a<55?AGEG[4]:a<65?AGEG[5]:AGEG[6]};
const r1=v=>Math.round(v*10)/10;

async function initRemote(){if(!sb)return;
 try{const {data}=await sb.auth.getSession();const u=data&&data.session&&data.session.user;
  if(u){const r=await sb.from('profiles').select('id,display_name,birth_year,role').eq('id',u.id).maybeSingle();ME=r.data||{id:u.id}}}catch(e){}
 authChecked=true;
 try{const {data,error}=await sb.from('sports').select('id,name,unit,kind,hb_test,active').eq('kind','cognitive');
  if(!error&&data){SP={};data.forEach(s=>{if(s.hb_test)SP[s.hb_test]=s});remoteOk=true}}catch(e){}
 renderAuth();if(!(P&&!P.done))route();if(ME)submitPending()}
async function submitPending(){const p=store.get('pending');if(!p||!sb||!ME)return;
 if(Date.now()-(p.ts||0)>864e5){store.set('pending',null);return}
 try{const {data,error}=await sb.rpc('hb_submit',{p_sport:p.sport,p_score:p.score,p_device:p.device,p_lang:p.lang,p_flags:[],p_detail:p.detail});
  if(error&&/no_profile/.test(error.message||''))return;
  store.set('pending',null);if(!error&&data&&data.status==='ok')toast(rs('pendingSaved'))}catch(e){}}
function toast(msg){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
function lockBox(){return `<div class=lock><div class=lockfake aria-hidden=true><div class=tiles>${['#7','63 %','248','41'].map(x=>`<div class=tile><small>—</small><b>${x}</b></div>`).join('')}</div><div class="hrow wr"><span>25–34</span><i style="width:80%"></i><span>—</span></div><div class="hrow wr"><span>35–44</span><i style="width:65%"></i><span>—</span></div></div>
 <div class=lockmsg><b>🔒 ${rs('lockT')}</b><span>${rs('lockB')}</span><a class="btn red" href="index.html?auth=register">${rs('reg')}</a><a href="index.html?auth=login">${rs('haveAcc')}</a></div></div>`}
function gateModal(t,v){if(!gated()||document.querySelector('.gate'))return;
 const o=document.createElement('div');o.className='gate';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-labelledby','gateT');
 o.innerHTML=`<div class=gbox><p class=gscore>${esc(L(t.name))}: <b>${fmt(t,v)}</b></p><h2 id=gateT>${rs('gateT')}</h2><p>${rs('gateB')}</p><ul>${['gate1','gate2','gate3','gate4'].map(k=>`<li>${rs(k)}</li>`).join('')}</ul>
 <div class=gbtns><a class="btn red" href="index.html?auth=register">${rs('reg')}</a><button class="btn line" type=button id=gclose>${rs('notNow')}</button></div><p class=gsmall>${rs('gateNote')} <a href="index.html?auth=login">${rs('haveAcc')}</a></p></div>`;
 const close=()=>{o.remove();document.removeEventListener('keydown',esck)};const esck=e=>{if(e.key==='Escape')close()};
 o.addEventListener('click',e=>{if(e.target===o)close()});document.addEventListener('keydown',esck);document.body.appendChild(o);
 const c=o.querySelector('#gclose');c.onclick=close;c.focus()}

function renderAuth(){const el=document.getElementById('auth');if(!el)return;
 el.innerHTML=ME?`<a class=pill href="index.html#profil=${encodeURIComponent(ME.id)}">👤 ${esc(ME.display_name||'')}</a>`:`<a class=pill href="index.html">${rs('login')}</a>`}

async function submitRun(t,v,detail,fl){const el=document.getElementById('save');if(!el)return;const s=sportOf(t);
 if(!sb||!s||s.active===false){el.textContent=remoteOk?rs('offline'):'';return}
 if(!ME){el.textContent=rs('notSaved');return}
 el.textContent=rs('saving');
 try{const {data,error}=await sb.rpc('hb_submit',{p_sport:s.id,p_score:v,p_device:runDev,p_lang:lang,p_flags:fl,p_detail:detail||null});
  if(error)throw error;
  el.textContent=data.status==='flagged'?rs('savedFlag'):data.personal_best?rs('savedPb'):data.previous_best!=null?rs('savedNoPb'):rs('saved')}
 catch(e){const m=String(e&&e.message||'');const k=Object.keys(RS.sk).find(x=>x.startsWith('err_')&&m.includes(x.slice(4)));el.textContent=rs('saveErr')+(k?': '+rs(k):'.')}}

async function cmpLoad(t){const el=document.getElementById('cmp');if(!el)return;const s=sportOf(t);
 if(!sb||!s){el.innerHTML='';return}
 const dev=cmpDev||defDev();
 el.innerHTML=`<h2>${rs('cmp')}</h2><p class=mut>${rs('loading')}</p>`;
 try{const {data,error}=await sb.rpc('hb_stats',{p_sport:s.id,p_device:dev});if(error)throw error;
  let typ=null;
  if(ME){const r=await sb.from('hb_runs').select('score').eq('sport_id',s.id).eq('user_id',ME.id).eq('status','ok').eq('device',dev).order('created_at',{ascending:false}).limit(10);
   const xs=(r.data||[]).map(x=>+x.score);
   if(xs.length>=3){xs.sort((a,b)=>t.low?a-b:b-a);const keep=xs.slice(0,xs.length-Math.max(1,Math.floor(xs.length*.1)));typ=r1(keep.reduce((a,b)=>a+b,0)/keep.length)}}
  if(!el.isConnected)return;
  el.innerHTML=cmpHtml(t,s,data||{n:0},typ,dev);
  el.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{cmpDev=b.dataset.dev;cmpLoad(t)})}
 catch(e){if(el.isConnected)el.innerHTML=`<h2>${rs('cmp')}</h2><p class=mut>${rs('noStats')}</p>`}}

function cmpHtml(t,s,d,typ,dev){const n=+d.n||0;
 let h=`<div class=cmph><h2>${rs('cmp')}</h2><div class=seg role=group>${['mouse','touch'].map(x=>`<button data-dev=${x} aria-pressed=${x===dev}>${rs(x)}</button>`).join('')}</div></div>`;
 const tiles=[];
 if(d.my_best!=null)tiles.push([rs('myBest'),fmt(t,r1(+d.my_best))]);
 if(typ!=null)tiles.push([rs('typical'),fmt(t,typ),rs('typHelp')]);
 if(d.median!=null)tiles.push([rs('median'),fmt(t,r1(+d.median))]);
 tiles.push([rs('players'),String(n)]);
 h+=`<div class=tiles>${tiles.map(x=>`<div class=tile><small>${x[0]}</small><b>${x[1]}</b>${x[2]?`<small>${x[2]}</small>`:''}</div>`).join('')}</div>`;
 if(!ME)return `<div class=cmph><h2>${rs('cmp')}</h2></div>${lockBox()}`;
 else if(d.my_best!=null){
  if(n>=MINP){const p=Math.round((+d.worse+0.5*+d.equal)/(n-1)*100);h+=`<p class=pct><b>${rs('pctTxt').replace('{p}',p)}</b>${+d.equal?' · '+rs('eqTxt').replace('{e}',d.equal):''}</p>`}
  else h+=`<p class=mut>${rs('fewPlayers').replace('{n}',n).replace('{m}',MINP)}</p>`}
 const gs=(d.groups||[]).slice().sort((a,b)=>AGEG.indexOf(a.g)-AGEG.indexOf(b.g));
 if(gs.length){const myG=ME?ageGroup(ME.birth_year):null,mx=Math.max(...gs.map(g=>+g.median),1);
  h+=`<h3>${rs('byAge')}</h3>${gs.map(g=>`<div class="hrow wr ${g.g===myG?'mine':''}"><span>${esc(g.g==='do 17'?'≤ 17':g.g)} <small class=mut>(${+g.n})</small></span><i style="width:${Math.max(2,+g.median/mx*100)}%"></i><span>${fmt(t,r1(+g.median))}</span></div>`).join('')}`}
 else if(n)h+=`<p class=mut>${rs('ageNote')}</p>`;
 h+=`<p><a href="index.html?sport=${encodeURIComponent(s.id)}">${rs('board')} →</a></p>`;
 return h}

function route(){const id=location.hash.slice(1);
 if(P&&!P.done&&id!=='dohlad'){P.nav++;location.hash='dohlad';return}
 if(id==='dohlad'){proctor();window.scrollTo(0,0);return}
 const t=visibleTests().find(x=>x.id===id);t?openTest(t):home();window.scrollTo(0,0)}
