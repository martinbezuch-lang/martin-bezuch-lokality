<style>
/* VOICE: hravý, športový, ako tester reflexov na jarmoku – jasné úlohy, žiadne kecy
   IDEA: testovacia plocha (arena) ako veľká modrá tabuľa z vlajok SK/CZ
   PICTURE: samotná aréna testu, cez celú šírku, je obrazom stránky

:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b1422);--ink:light-dark(#0f1a2b,#eef2f8);--mut:light-dark(#5a6678,#9aa7ba);--card:light-dark(#f2f4f8,#14203a);--line:light-dark(#dfe4ec,#24324f);--blue:#2563eb;--red:#D7141A;--deep:light-dark(#1d4ed8,#22447a);--g1:light-dark(#2563eb,#22447a);--g2:light-dark(#dc2626,#c8302a);--c-rych:light-dark(#ea580c,#c2410c);--c-pam:light-dark(#7c3aed,#6d28d9);--c-post:light-dark(#2563eb,#1d4ed8);--c-jaz:light-dark(#16a34a,#15803d);--c-log:light-dark(#0d9488,#0f766e);--ring:light-dark(rgba(255,255,255,.12),#b8312c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,.logo b,.huge,.num,.word,.glyph{font-family:Inter,system-ui,sans-serif}
h1{font-size:clamp(32px,5vw,52px);line-height:1.05;margin:0 0 10px;text-wrap:balance;font-weight:800}
.top{padding-block:14px;border-bottom:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:18px}
.brand{width:40px;height:40px;border-radius:12px;background:#2563eb;display:grid;place-items:center;flex:none}
.logo b{display:block;font-weight:800;font-size:17px;line-height:1.2}.logo small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:520px){.logo>span:last-child,#allT{display:none}}
.thtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.thtop .back{margin:0}
.qrbtn{cursor:pointer;font-family:inherit;color:var(--ink)}
.qr{background:#fff;border-radius:16px;padding:10px;width:min(70vw,260px);aspect-ratio:1;margin:8px auto;display:grid;place-items:center;color:#0f1a2b}.qr svg{width:100%;height:100%;display:block}
.qrbox{text-align:center}.qrurl{font-weight:600;overflow-wrap:anywhere;margin:6px 0 14px!important}
.langsel{appearance:auto;font-family:inherit;color:var(--ink);cursor:pointer;max-width:9.5em}
.pill{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;text-decoration:none}
.save{font-weight:600;margin:0}.save a{color:#fff}
.cmph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cmph h2{font-size:22px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin:14px 0}
.tile{background:var(--card);border-radius:14px;padding:12px 14px}.tile b{display:block;font-size:24px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}.tile small{display:block;color:var(--mut);font-size:13px}
.pct{font-size:18px;margin:6px 0 10px}.quick{margin:4px 0 8px;font-size:15px;line-height:1.6;opacity:.95}.quick a{color:inherit;text-decoration:underline;text-underline-offset:3px}.quick:empty{display:none}.fboard{margin-top:22px}.frow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;margin:4px 0;background:rgba(127,140,170,.08)}.frow.mine{background:rgba(59,130,246,.18);font-weight:700}.frow a{flex:1;color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frow b{white-space:nowrap}.fr-n{opacity:.6;min-width:2.2em;font-variant-numeric:tabular-nums}#cmp{margin-bottom:40px}#cmp h3{font-size:17px;margin:18px 0 8px}#cmp:empty{display:none}
.lock{position:relative;border-radius:16px;overflow:hidden;margin:12px 0 8px}
.lockfake{filter:blur(6px);opacity:.55;pointer-events:none;user-select:none;padding:4px}
.lockmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;background:color-mix(in srgb,var(--bg) 40%,transparent)}
.lockmsg b{font-size:18px}.lockmsg span{color:var(--mut);max-width:40ch}.lockmsg a:not(.btn){font-weight:600}
.gate{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.6);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.gbox{background:var(--bg);color:var(--ink);border-radius:20px;padding:clamp(20px,4vw,32px);max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.gbox h2{font-size:clamp(22px,4vw,28px);line-height:1.15;margin:4px 0 8px}.gbox p{margin:0 0 8px}.gbox ul{margin:0 0 16px;padding-left:20px}.gbox li{margin:3px 0}
.gscore{color:var(--mut);font-size:15px}.gscore b{color:var(--ink)}
.gbtns{display:flex;gap:10px;flex-wrap:wrap}.gbtns .btn{flex:1 1 180px}.gsmall{font-size:13px;color:var(--mut);margin-top:12px!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#0f1a2b;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
@media(prefers-reduced-motion:reduce){.gate{animation:none}}
.seg{display:flex;border:2px solid var(--blue);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:700 15px Inter;min-height:40px;min-width:52px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.hero{background:var(--deep);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:340px;height:340px;border-radius:50%;border:46px solid var(--ring)}
.hero .wrap{position:relative;z-index:1}
.lead{font-size:17px;max-width:60ch;margin:0 0 18px;opacity:.92}
.stats{display:flex;flex-wrap:wrap;gap:10px}

.chip b{display:block;font:800 26px Inter}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;background:var(--card);border-radius:16px;padding:16px;transition:transform .15s}
.card:hover{transform:translateY(-2px)}.card:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.glyph{flex:none;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:var(--g);color:#fff;font-weight:800;font-size:19px}
.glyph.big{width:96px;height:96px;font-size:30px;border-radius:22px;margin:0 auto 18px;background:rgba(255,255,255,.16)}
.ct b{display:block;font-size:17px;line-height:1.25}
.ct small{display:block;color:var(--mut);font-size:14px;line-height:1.4;margin:3px 0 6px}
.ct em{font-style:normal;font-size:13px;font-weight:600;color:var(--blue)}
:root:not([data-theme=light]) .ct em{color:light-dark(var(--blue),#8fb6ec)}
.tools{margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;border:0;background:#fff;color:var(--blue);font:700 17px Inter;cursor:pointer;text-decoration:none;touch-action:manipulation}
.btn:focus-visible,.cell:focus-visible,.cc:focus-visible{outline:3px solid #ffd400;outline-offset:2px}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);font-size:15px}
.btn.red{background:var(--red);color:#fff}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.testhead{padding-bottom:18px}
.testhead p{margin:0;color:var(--mut);max-width:70ch}
.back{display:inline-block;margin-bottom:10px;font-weight:600;text-decoration:none;color:var(--mut)}
.arena{background:var(--deep);color:#fff;min-height:clamp(400px,58vh,600px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:64px 16px 28px;text-align:center;position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
.arena.red{background:#c2121a}.arena.green{background:#16a34a}
.arena.bad{animation:bad .5s}
@keyframes bad{30%{background:#c2121a}}
.hud{position:absolute;top:16px;left:0;right:0;font-weight:600;font-size:15px;opacity:.9}
.sndb{position:absolute;top:8px;right:10px;z-index:2;background:rgba(255,255,255,.15);border:0;border-radius:999px;width:38px;height:38px;font-size:18px;cursor:pointer}
.big{font:800 clamp(30px,6vw,56px)/1.1 Inter}
.huge{font-size:clamp(40px,10vw,96px);font-weight:800;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere;max-width:100%}
.lbl{margin:0;text-transform:none;opacity:.8;font-size:15px}
.sus{background:#fff;color:#8a0d12;border-left:6px solid var(--red);border-radius:12px;padding:12px 16px;text-align:left;max-width:min(92vw,460px);display:flex;flex-direction:column;gap:4px;font-size:15px}
.rec{background:var(--red);padding:6px 14px;border-radius:999px;font-weight:700;margin:0}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.cells{display:grid;gap:10px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));width:min(80vw,340px)}
.cell{aspect-ratio:1;border:0;border-radius:12px;background:rgba(255,255,255,.18);cursor:pointer;transition:background .12s}
.cell.on{background:#fff}.cell.tap{background:#8fb6ec}.cell.miss{background:#0a2547}
.tight{gap:6px}.cc{aspect-ratio:1;border:0;border-radius:8px;cursor:pointer}.cc.hint{outline:4px solid #fff}
.chimp{grid-template-columns:repeat(8,minmax(0,1fr));width:min(94vw,640px);gap:6px}
.chimp span,.cn{aspect-ratio:1}
.cn{border:2px solid #fff;border-radius:10px;background:transparent;color:#fff;font:800 clamp(14px,3.4vw,24px) Inter;cursor:pointer}
.cn.mask{background:#fff;color:transparent}.cn.gone{visibility:hidden}
.target{position:absolute;width:72px;height:72px;border-radius:50%;border:0;cursor:crosshair;background:radial-gradient(circle,#fff 0 18%,var(--red) 19% 42%,#fff 43% 62%,var(--red) 63%)}
.num{font-size:clamp(32px,8vw,72px);font-weight:800;letter-spacing:.06em;overflow-wrap:anywhere;max-width:100%}
.num.x{text-decoration:line-through;text-decoration-color:var(--red)}
.bar{width:min(70vw,360px);height:8px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.ask{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(90vw,420px)}
.ask label{font-size:18px;font-weight:600}
.ask input{width:100%;font:800 28px Inter;text-align:center;padding:12px;border-radius:14px;border:0;color:var(--blue);background:#fff}
.word{font-size:clamp(34px,8vw,68px);font-weight:800;padding:8px 18px;border-radius:14px}
.word.pop{animation:pop .2s}@keyframes pop{from{transform:scale(.9);opacity:.4}}
.word.g{background:#16a34a}.word.b{background:var(--red)}
.word .gap{color:#ffd400;border-bottom:4px solid #ffd400;padding:0 4px}
.stage{background:#fff;border-radius:18px;padding:26px 30px;min-width:min(80vw,340px)}
.sw{font:800 clamp(34px,8vw,60px) Inter}
.pad{width:min(86vw,520px);height:min(46vh,320px);border:0;border-radius:24px;background:#fff;color:var(--blue);font:800 clamp(28px,7vw,60px) Inter;cursor:pointer}
.pad:active{background:#dbe7f7}
.typebox{width:min(94vw,820px);display:flex;flex-direction:column;gap:12px}
.tt{background:#fff;color:#7a8699;border-radius:16px;padding:18px 20px;font-size:clamp(18px,2.4vw,22px);line-height:1.6;text-align:left;margin:0}
.tt .ok{color:#0f1a2b}.tt .no{color:#fff;background:var(--red);border-radius:3px}
.tt .cur{box-shadow:inset 0 -3px 0 var(--blue)}
.typebox textarea{font:18px/1.5 Inter;border-radius:14px;border:0;padding:14px;resize:none;width:100%}
.dots{width:min(94vw,640px);aspect-ratio:400/260;background:rgba(255,255,255,.08);border-radius:16px}
.sch{grid-template-columns:repeat(5,minmax(0,1fr));width:min(90vw,420px);gap:8px}
.sc{aspect-ratio:1;border:0;border-radius:10px;background:#fff;color:var(--blue);font:800 clamp(18px,5vw,28px) Inter;cursor:pointer}
.sc.done{opacity:.3}.sc.x,.lt.x{background:var(--red);color:#fff}
.gng{width:min(46vw,180px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.1)}
.gng.go{background:#22c55e}.gng.no{background:var(--red)}.gng.hit{background:#fff}.gng.bad{background:#000}
.btn.on{background:#ffd400}
.mot{position:relative;width:min(92vw,640px);height:min(48vh,360px);background:rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
.ball{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;border:0;padding:0;background:#fff;cursor:pointer}
.ball.tg{background:#ffd400}.ball.no{background:var(--red)}
.shp{width:min(40vw,200px);height:min(40vw,200px);background:rgba(255,255,255,.08);border-radius:16px}
.track{position:relative;width:min(90vw,640px);height:56px;background:rgba(255,255,255,.12);border-radius:12px}
.tl{position:absolute;top:-8px;bottom:-8px;width:4px;margin-left:-2px;background:#ffd400}
.mk{position:absolute;top:8px;bottom:8px;width:8px;margin-left:-4px;background:#fff;border-radius:4px}
.ang{width:min(70vw,260px);height:min(70vw,260px)}
.srch{grid-template-columns:repeat(8,minmax(0,1fr));width:min(94vw,560px);gap:4px}
.lt{min-height:44px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font:600 clamp(20px,5vw,28px) Inter;cursor:pointer}
.fnd{font-size:22px;color:#ffd400}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(24px,4vw,56px);align-items:start}
.world h2{font-size:22px;margin:0 0 8px}.world>p{margin:0 0 12px}
.hrow.wr{grid-template-columns:9.5em minmax(0,1fr) auto}.wr span:first-child{overflow-wrap:normal;hyphens:auto;line-height:1.3}
.wr.ext i{background:#8a97ab!important}.wr.you i{background:var(--red)!important}.wr.you,.wr.mine{font-weight:700}
.wr.mine i{box-shadow:0 0 0 3px light-dark(#ffd400,#ffd400)}
.agein{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-weight:600}
.agein input{width:6em;font:16px Inter;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.src{font-size:13px;color:var(--mut)}
.pform{display:grid;gap:16px;max-width:640px}.pform h2{margin:0;font-size:24px}
.pform label{display:grid;gap:6px;font-weight:600}

.pform label.chk,label.chk{display:flex;align-items:center;gap:10px;font-weight:400;min-height:36px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--blue)}
fieldset{border:2px solid var(--line);border-radius:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:4px 14px;padding:12px 14px}
legend{font-weight:600;padding:0 6px}
.err{color:var(--red);font-weight:600;margin:0}.arena .err{color:#ffd400}
.pinrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pinrow input{width:9em;font:16px Inter;padding:12px;min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.arena .pinrow input{border:0;background:#fff;color:var(--blue)}
.ptop{background:var(--card);padding:12px max(5vw,16px);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:600}
.dz summary{cursor:pointer;font-weight:600;color:var(--mut);min-height:44px;display:flex;align-items:center}

.ch{display:flex;align-items:center;gap:10px;font:800 18px Inter}

.code{font:700 18px ui-monospace,Menlo,monospace;letter-spacing:.06em}

.intro p{max-width:46ch;margin:0 auto 18px;opacity:.9}

.hrow{display:grid;grid-template-columns:3em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin:6px 0}

run(a,done){let level=1,lives=3;

  const balls=[...Array(n)].map((_,i)=>{const g=Math.random()*6.283;return{x:R(r,W-r),y:R(r,H-r),vx:Math.cos(g)*sp,vy:Math.sin(g)*sp,t:i<k}});
  box.innerHTML=balls.map(()=>'<button class=ball aria-label="loptička"></button>').join('');

  const draw=()=>balls.forEach(b=>b.el.style.transform=`translate(${b.x-r}px,${b.y-r}px)`);draw();
  let moving=false,picking=false,picked=0,good=0;

   if(balls[i].t){good++;e.classList.add('tg')}else e.classList.add('no');
   if(picked===k){picking=false;balls.forEach(b=>b.t&&b.el.classList.add('tg'));

function runTest(t,cb){cleanup();const a=fresh();flags=new Set();running=true;runDev=defDev();
 a.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.pointerType==='pen')runDev='touch';else if(e.pointerType==='mouse')runDev='mouse'},true);
 ['pointerdown','click','keydown','input'].forEach(ev=>a.addEventListener(ev,e=>{if(!e.isTrusted)flag('bot')},true));
 t.run(a,(v,d)=>{const fl=[...flags];cleanup();cb(v,d,fl)})}
function start(t){runTest(t,(v,d)=>finish(t,v,d))}

function finish(t,v,detail){cleanup();const a=fresh();const G=gated(),best=G?{}:getBest(),old=best[t.id],sus=[...flags];
 const rec=!G&&!sus.length&&(old==null||(t.low?v<old:v>old));if(rec){best[t.id]=v;store.set('best',best)}
 if(!G&&!sus.length){const hist=store.get('hist')||{};hist[t.id]=[...(hist[t.id]||[]),v].slice(-10);store.set('hist',hist)}

const BOARD={};
async function boardData(s,fresh){if(!fresh&&BOARD[s.id])return BOARD[s.id];
 const [r,p,tp,fr]=await Promise.all([
  sb.from('records').select('user_id,value').eq('sport_id',s.id),
  sb.from('public_profiles').select('id,display_name,gender,country'),
  sb.rpc('hb_tops').then(x=>x,()=>({data:[]})),
  ME?sb.from('friendships').select('friend_id').eq('user_id',ME.id):Promise.resolve({data:[]})]);
 if(r.error)throw r.error;
 const low=!!s.lower_is_better,best=new Map();
 (r.data||[]).forEach(x=>{const v=+x.value,o=best.get(x.user_id);if(o==null||(low?v<o:v>o))best.set(x.user_id,v)});
 const prof=new Map((p.data||[]).map(x=>[x.id,x]));
 const tops=new Map();(tp.data||[]).forEach(x=>{if(x.sport_id===s.id)tops.set(x.user_id,(x.tops||[]).map(Number))});
 const friends=new Set((fr.data||[]).map(x=>x.friend_id));
 const cmp=(a,b)=>{const d=low?best.get(a)-best.get(b):best.get(b)-best.get(a);if(d)return d;const A=tops.get(a)||[],B=tops.get(b)||[];
  for(let i=1;i<5;i++){const x=A[i],y=B[i];if(x===undefined&&y===undefined)return 0;if(x===undefined)return 1;if(y===undefined)return -1;if(x!==y)return low?x-y:y-x}return 0};
 return BOARD[s.id]={best,prof,friends,cmp}}

async function quickLoad(t){const el=document.getElementById('quick'),s=sportOf(t);if(!el||!sb||!s||!ME)return;
 try{const B=await boardData(s,true),me=B.prof.get(ME.id),mb=B.best.get(ME.id);if(!me||mb==null||!el.isConnected)return;
  const pool=[...B.best.keys()].filter(id=>{const q=B.prof.get(id);return q&&q.gender===me.gender&&q.country===me.country}).sort(B.cmp);
  const rank=pool.indexOf(ME.id)+1;if(!rank)return;
  let worse=0,eq=0;pool.forEach(id=>{if(id===ME.id)return;const c=B.cmp(ME.id,id);if(c<0)worse++;else if(c===0)eq++});
  const pct=pool.length>=2?Math.min(99.9,(worse+eq/2+0.5)/pool.length*100):null;
  el.innerHTML=`<a href="index.html?sport=${encodeURIComponent(s.id)}">🏆 <b>#${rank}</b> z ${pool.length}</a> · ${esc(me.gender==='Z'?qk('women'):qk('men'))} · ${esc(me.country||'')}<br>${qk('pb')} <b>${fmt(t,mb)}</b>${pct!=null?` · ${qk('pctl')} <b>${Math.round(pct)}</b>`:''} · <a href="index.html?sport=${encodeURIComponent(s.id)}">${rs('board')} →</a>`}
 catch(e){}}

async function friendsBoard(t,host){const s=sportOf(t);if(!host||!sb||!s||!ME)return;
 try{const B=await boardData(s);const ids=[...B.best.keys()].filter(id=>id===ME.id||B.friends.has(id)).sort(B.cmp);
  const box=document.createElement('div');box.className='fboard';
  if(ids.length<=1){box.innerHTML=`<h3>👥 ${qk('fb')}</h3><p class=mut>${qk('fbNone')}</p>`;host.appendChild(box);return}
  box.innerHTML=`<h3>👥 ${qk('fb')}</h3>`+ids.map((id,i)=>{const q=B.prof.get(id)||{},mine=id===ME.id;
   return `<div class="frow ${mine?'mine':''}"><span class=fr-n>#${i+1}</span><a href="index.html#profil=${encodeURIComponent(id)}">${esc(mine?qk('me')+' · '+(q.display_name||''):q.display_name||'?')}</a><b>${fmt(t,B.best.get(id))}</b></div>`}).join('');
  host.appendChild(box)}catch(e){}}

 if(!sb||!s||s.active===false){el.textContent=remoteOk?rs('offline'):'';return}

 el.textContent=rs('saving');
 try{const {data,error}=await sb.rpc('hb_submit',{p_sport:s.id,p_score:v,p_device:runDev,p_lang:lang,p_flags:fl,p_detail:detail||null});

 catch(e){const m=String(e&&e.message||'');const k=Object.keys(RS.sk).find(x=>x.startsWith('err_')&&m.includes(x.slice(4)));el.textContent=rs('saveErr')+(k?': '+rs(k):'.')}}

async function cmpLoad(t){const el=document.getElementById('cmp');if(!el)return;const s=sportOf(t);
 if(!sb||!s){el.innerHTML='';return}
 const dev=cmpDev||defDev();
 el.innerHTML=`<h2>${rs('cmp')}</h2><p class=mut>${rs('loading')}</p>`;
 try{const {data,error}=await sb.rpc('hb_stats',{p_sport:s.id,p_device:dev});if(error)throw error;
  let typ=null;
  if(ME){const r=await sb.from('hb_runs').select('score').eq('sport_id',s.id).eq('user_id',ME.id).eq('status','ok').eq('device',dev).order('created_at',{ascending:false}).limit(10);
   const xs=(r.data||[]).map(x=>+x.score);
   if(xs.length>=3){xs.sort((a,b)=>t.low?a-b:b-a);const keep=xs.slice(0,xs.length-Math.max(1,Math.floor(xs.length*.1)));typ=r1(keep.reduce((a,b)=>a+b,0)/keep.length)}}
  if(!el.isConnected)return;
  el.innerHTML=cmpHtml(t,s,data||{n:0},typ,dev);
  if(ME)friendsBoard(t,el);
  el.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{cmpDev=b.dataset.dev;cmpLoad(t)})}
 catch(e){if(el.isConnected)el.innerHTML=`<h2>${rs('cmp')}</h2><p class=mut>${rs('noStats')}</p>`}}

function cmpHtml(t,s,d,typ,dev){const n=+d.n||0;

 sh.focus()}

ားလုံး"],"simpanz":["ချင်ပန်ဇီ စမ်းသပ်မှု","အငယ်ဆုံးမှ စ၍ နံပါတ်များကို နှိပ်ပါ။ ပထမအကြိမ် နှိပ်ပြီးနောက် ကျန်တာတွေ ဖုံးသွားမည်။ သုံးကြိမ်မှားလျှင် ရှုံးမည်။","နံပါတ်"],"vizualna":["မြင်ကွင်း မှတ်ဉာဏ်","အကွက်အချို့ ခဏတာ မီးလင်းမည်။ အားလုံးကို မှတ်သားပါ။ တစ်ကြိမ်တွင် သုံးခါမှားလျှင် အသက်တစ်ခု ဆုံးမည်၊ အသက် 3 ခု ရှိသည်။","အဆင့်"],"pisanie":["စာရိုက်ခြင်း","စာကို အတိအကျ ပြန်ရိုက်ပါ။ တစ်မိနစ်လျှင် စကားလုံးအရေအတွက်နှင့် တိကျမှုကို တိုင်းတာသည်။","WPM"],"stroop":["Stroop စမ်းသပ်မှု","စကားလုံး၏ အဓိပ္ပာယ်ကို မဟုတ်ဘဲ ရေးထားသည့် အရောင်ကို နှိပ်ပါ။ စက္ကန့် 30 ရှိပြီး အမှားများကို နုတ်မည်။","မှတ်"],"klikanie":["နှိပ်နှုန်း","5 စက္ကန့်အတွင်း ဘယ်နှစ်ကြိမ် နှိပ်နိုင်မလဲ? ပထမအကြိမ် နှိပ်သည်နှင့် အချိန်စတင်သည်။","ကြိမ်/စက္ကန့်"],"pocty":["အမြန် သင်္ချာ","စက္ကန့် 60 အတွင်း ပုစ္ဆာ အများဆုံး ဖြေပါ။ အဖြေမှန်ကို အလိုအလျောက် လက်ခံမည်။","ပုစ္ဆာ"],"cas":["အချိန် ခန့်မှန်းခြင်း","နာရီမကြည့်ဘဲ ပေးထားသော အချိန်ပြည့်လျှင် စက္ကန့်တိုင်းကိရိယာကို အတိအကျ ရပ်ပါ။ သုံးကြိမ် ကြိုးစားပြီး ပျမ်းမျှ ကွာခြားချက်ကို ရေတွက်သည်။","ms ကွာ"],"farby":["အရောင် အာရုံခံမှု","အရောင်အနည်းငယ် ကွဲပြားသော အကွက်ကို ရှာပါ။ တစ်ကြိမ်လျှင် ကွာခြားချက် ပိုသေးလာမည်။ အသက် 3 ခု ရှိသည်။","အဆင့်"],"bodky":["အစက် ရေတွက်ခြင်း","အစက်များ ခဏလေး ပေါ်လာမည်။ 10 စက်အထိ အတိအကျ ဖြစ်ရမည်၊ ထို့ထက်များလျှင် ±10% ဖြစ်လျှင် လုံလောက်သည်။ အသက် 3 ခု ရှိသည်။","မှန်"],"skcz":["စလိုဗက် သို့မဟုတ် ချက်?","စကားလုံးသည် စလိုဗက်လား ချက်လား ဆုံးဖြတ်ပါ။ စက္ကန့် 45 ရှိသည်၊ မှန် +1၊ မှား −1။","မှတ်"],"vybrane":["စလိုဗက် i/y စာလုံးပေါင်း","i/í သို့မဟုတ် y/ý ကို ဖြည့်ပါ။ စက္ကန့် 45 ရှိသည်၊ မှန် +1၊ မှား −1။","မှတ်"],"schulte":["Schulte ဇယား","1 မှ 25 အထိ နံပါတ်များကို အစဉ်လိုက် အမြန်ဆုံး နှိပ်ပါ။ စက္ကန့်ဖြင့် အချိန်ကို တိုင်းတာသည်။","s"],"gonogo":["အစိမ်း / အနီ","အစိမ်းရောင် စက်ဝိုင်း ပေါ်လာလျှင် နှိပ်ပါ။ အနီရောင်ကို မနှိပ်ပါနှင့်။ ရလဒ်မှာ ပျမ်းမျှ တုံ့ပြန်ချိန်နှင့် အမှားတစ်ခုလျှင် 100 ms ပေါင်းထားခြင်း ဖြစ်သည်။","ms"],"nback":["အလုပ်လုပ် မှတ်ဉာဏ် (2-back)","စာလုံးများ တစ်လုံးချင်း ပေါ်လာမည်။ စာလုံးသည် နှစ်ဆင့်အရင်က စာလုံးနှင့် တူပါက တူသည် ကို နှိပ်ပါ။ ရလဒ်မှာ မှန်ကန်သော ဆုံးဖြတ်ချက် ရာခိုင်နှုန်း ဖြစ်သည်။","%"],"lopticky":["ဘောလုံး လိုက်ကြည့်ခြင်း","အဝါရောင်ဘောလုံးများကို မှတ်ထားပါ။ ထို့နောက် အခြားဘောလုံးများနှင့် ရောသွားမည်။ ရပ်သွားလျှင် အဝါရောင်ဖြစ်ခဲ့သည်တို့ကို နှိပ်ပါ။ အသက် 3 ခု ရှိသည်။","အဆင့်"],"anagramy":["စာလုံးဖွဲ့","ရောထားသော စာလုံးများမှ စကားလုံးကို ပြန်ဖွဲ့ပါ။ စက္ကန့် 60 ရှိသည်။","စကားလုံး"],"rotacia":["ပုံ လှည့်ခြင်း","ညာဘက်ပုံသည် လှည့်ထားရုံသာလား၊ ပုံရိပ်ပြောင်းပြန်လည်း ဖြစ်နေသလား? စက္ကန့် 60 ရှိသည်၊ မှန် +1၊ မှား −1။","မှတ်"],"ciara":["မျဉ်းပေါ်တွင် ရပ်ပါ","ပြေးသူတစ်ဦး လမ်းကြောင်းအတိုင်း ရွေ့နေသည်။ အဝါရောင်မျဉ်းပေါ်တွင် အတိအကျ ရပ်ပါ။ ငါးကြိမ်၊ တစ်ကြိမ်ထက် တစ်ကြိမ် ပိုမြန်လာမည်။","% ကွာ"],"uhol":["ထောင့် ခန့်မှန်းခြင်း","ထောင့်သည် ဘယ်နှစ်ဒီဂရီ ရှိသလဲ ခန့်မှန်းပါ။ ငါးကြိမ် ကြိုးစားပြီး ပျမ်းမျှ ကွာခြားချက်ကို ရေတွက်သည်။ ထောင့်မှာ မျဉ်းနှစ်ကြောင်းကြားရှိ အဝါရောင်မျဉ်းကွေးဖြင့် ပြထားသော ထောင့် ဖြစ်သည် (အမြဲ 180° အောက်)။","° ကွာ"],"pismeno":["စာလုံး ရှာခြင်း","ဆင်တူသော စာလုံးများ ဇယားထဲတွင် အမှတ်အသားပါသော စာလုံးမှန်ကို ရှာပါ။ ဆယ်ကြိမ်၊ အမှားတစ်ခုလျှင် တစ်စက္ကန့် ပေါင်းမည်။","s"]},"W":"ပန်းသီး သစ်တော်သီး စားပွဲ ကုလားထိုင် ပြတင်းပေါက် တံခါး စာအုပ် ဘောပင် ခဲတံ မီးအိမ် သော့ နာရီ ဖုန်း ကွန်ပျူတာ ကား ရထား လေယာဉ် လှေ စက်ဘီး လမ်း တံတား မြစ် ကန် ပင်လယ် တောင် သစ်တော သစ်ပင် ပန်း မြက် နေ လ ကြယ် တိမ် မိုး နှင်း လေ မုန်တိုင်း ဆောင်း နွေ ဆောင်းဦး နွေဦး မနက် ညနေ ည ခွေး ကြောင် မြင်း နွား သိုး ဆိတ် ကြက် ဘဲ မြေခွေး ဝံပုလွေ ဝက်ဝံ ယုန် ငါး ငှက် လိပ်ပြာ ပျား ပေါင်မုန့် ထောပတ် ဒိန်ခဲ နို့ ဥ ဟင်းချို ကိတ်မုန့် ချောကလက် ကော်ဖီ လက်ဖက်ရည် ရေ ဆား သကြား အင်္ကျီ ဦးထုပ် ဖိနပ် ရှပ်အင်္ကျီ လက်အိတ် ထီး ကျောင်း ဆရာ ဆရာဝန် ဥယျာဉ် ခြံစည်းရိုး မီးဖိုချောင် အခန်း အိပ်ရာ ခေါင်းအုံး မှန် ဆပ်ပြာ မျက်နှာသုတ်ပဝါ ဂီတာ ဗုံ တယော စန္ဒယား ဂီတ သီချင်း အက ပုံ စက္ကူ ကတ်ကြေး","SEN":["ဒီမနက် ကော်ဖီသောက်ရင်း ပြတင်းပေါက်ကနေ မိုးရွာတာကို ကြည့်ခဲ့တယ်။","မြေခွေးအိုကြီးဟာ တောင်တွေနောက်မှာ တိတ်တဆိတ် နေခဲ့တယ်။","မှောင်လာတဲ့အခါ ရွာတစ်ရွာလုံး အိပ်ပျော်သွားတယ်။","ဥယျာဉ်ထဲမှာ ခရမ်းချဉ်သီး၊ သခွားသီးနဲ့ မုန်လာဥနီ ပေါက်နေတယ်။","ကြောင်ကလေး ငါးကောင် ကော်ဇောပျော့ပေါ်မှာ ကစားနေကြတယ်။","အဘိုးက ကလေးတွေကို လိမ္မာတဲ့ ဇီးကွက်အိုအကြောင်း ပုံပြင်ပြောပြတယ်။"],"C":["အနီ","အပြာ","အစိမ်း","အဝါ","ခရမ်း","လိမ္မော်"]}};

 TESTS.forEach(t=>{const x=d.T[t.id];if(x){t.name[l]=x[0];t.desc[l]=x[1];t.u[l]=x[2]}})}
