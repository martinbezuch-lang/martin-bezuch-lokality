<style>
/* VOICE: hravý, športový, ako tester reflexov na jarmoku – jasné úlohy, žiadne kecy
   IDEA: testovacia plocha (arena) ako veľká modrá tabuľa z vlajok SK/CZ
   PICTURE: samotná aréna testu, cez celú šírku, je obrazom stránky
   COLOUR and TYPE: biela, vlajková modrá #11457E, červená #D7141A; Archivo 800 + Inter
   LAYOUT: hlavička, modrý hero s profilom, mriežka testov; test = nadpis, aréna, história */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b1422);--ink:light-dark(#0f1a2b,#eef2f8);--mut:light-dark(#5a6678,#9aa7ba);--card:light-dark(#f2f4f8,#14203a);--line:light-dark(#dfe4ec,#24324f);--blue:#2563eb;--red:#D7141A}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,.logo b,.huge,.num,.word,.glyph{font-family:Inter,system-ui,sans-serif}
h1{font-size:clamp(32px,5vw,52px);line-height:1.05;margin:0 0 10px;text-wrap:balance;font-weight:800}
.top{padding-block:14px;border-bottom:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:18px}
.brand{width:40px;height:40px;border-radius:12px;background:#2563eb;display:grid;place-items:center;flex:none}
.logo b{display:block;font-weight:800;font-size:17px;line-height:1.2}.logo small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;text-decoration:none}
.save{font-weight:600;margin:0}.save a{color:#fff}
.cmph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cmph h2{font-size:22px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin:14px 0}
.tile{background:var(--card);border-radius:14px;padding:12px 14px}.tile b{display:block;font-size:24px;font-weight:800;line-height:1.2;white-space:nowrap}.tile small{display:block;color:var(--mut);font-size:13px}
.pct{font-size:18px;margin:6px 0 10px}#cmp{margin-bottom:40px}#cmp h3{font-size:17px;margin:18px 0 8px}#cmp:empty{display:none}
.seg{display:flex;border:2px solid var(--blue);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:700 15px Inter;min-height:40px;min-width:52px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.hero{background:#1d4ed8;color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:340px;height:340px;border-radius:50%;border:46px solid rgba(255,255,255,.12)}
.hero .wrap{position:relative;z-index:1}
.lead{font-size:17px;max-width:60ch;margin:0 0 18px;opacity:.92}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;font-size:14px}
.chip b{display:block;font:800 26px Inter}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;background:var(--card);border-radius:16px;padding:16px;transition:transform .15s}
.card:hover{transform:translateY(-2px)}.card:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.glyph{flex:none;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:var(--g);color:#fff;font-weight:800;font-size:19px}
.glyph.big{width:96px;height:96px;font-size:30px;border-radius:22px;margin:0 auto 18px;background:rgba(255,255,255,.16)}
.ct b{display:block;font-size:17px;line-height:1.25}
.ct small{display:block;color:var(--mut);font-size:14px;line-height:1.4;margin:3px 0 6px}
.ct em{font-style:normal;font-size:13px;font-weight:600;color:var(--blue)}

.tools{margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;border:0;background:#fff;color:var(--blue);font:700 17px Inter;cursor:pointer;text-decoration:none;touch-action:manipulation}
.btn:focus-visible,.cell:focus-visible,.cc:focus-visible{outline:3px solid #ffd400;outline-offset:2px}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);font-size:15px}
.btn.red{background:var(--red);color:#fff}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.testhead{padding-bottom:18px}
.testhead p{margin:0;color:var(--mut);max-width:70ch}
.back{display:inline-block;margin-bottom:10px;font-weight:600;text-decoration:none;color:var(--mut)}
.arena{background:#1d4ed8;color:#fff;min-height:clamp(400px,58vh,600px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:64px 16px 28px;text-align:center;position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
.arena.red{background:#c2121a}.arena.green{background:#16a34a}
.arena.bad{animation:bad .5s}
@keyframes bad{30%{background:#c2121a}}
.hud{position:absolute;top:16px;left:0;right:0;font-weight:600;font-size:15px;opacity:.9}
.big{font:800 clamp(30px,6vw,56px)/1.1 Inter}
.huge{font-size:clamp(44px,10vw,96px);font-weight:800;line-height:1;white-space:nowrap}
.lbl{margin:0;text-transform:none;opacity:.8;font-size:15px}
.sus{background:#fff;color:#8a0d12;border-left:6px solid var(--red);border-radius:12px;padding:12px 16px;text-align:left;max-width:min(92vw,460px);display:flex;flex-direction:column;gap:4px;font-size:15px}
.rec{background:var(--red);padding:6px 14px;border-radius:999px;font-weight:700;margin:0}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.cells{display:grid;gap:10px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));width:min(80vw,340px)}
.cell{aspect-ratio:1;border:0;border-radius:12px;background:rgba(255,255,255,.18);cursor:pointer;transition:background .12s}
.cell.on{background:#fff}.cell.tap{background:#8fb6ec}.cell.miss{background:#0a2547}
.tight{gap:6px}.cc{aspect-ratio:1;border:0;border-radius:8px;cursor:pointer}.cc.hint{outline:4px solid #fff}
.chimp{grid-template-columns:repeat(8,minmax(0,1fr));width:min(94vw,640px);gap:6px}
.chimp span,.cn{aspect-ratio:1}
.cn{border:2px solid #fff;border-radius:10px;background:transparent;color:#fff;font:800 clamp(14px,3.4vw,24px) Inter;cursor:pointer}
.cn.mask{background:#fff;color:transparent}.cn.gone{visibility:hidden}
.target{position:absolute;width:72px;height:72px;border-radius:50%;border:0;cursor:crosshair;background:radial-gradient(circle,#fff 0 18%,var(--red) 19% 42%,#fff 43% 62%,var(--red) 63%)}
.num{font-size:clamp(32px,8vw,72px);font-weight:800;letter-spacing:.06em;overflow-wrap:anywhere;max-width:100%}
.num.x{text-decoration:line-through;text-decoration-color:var(--red)}
.bar{width:min(70vw,360px);height:8px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.ask{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(90vw,420px)}
.ask label{font-size:18px;font-weight:600}
.ask input{width:100%;font:800 28px Inter;text-align:center;padding:12px;border-radius:14px;border:0;color:var(--blue);background:#fff}
.word{font-size:clamp(34px,8vw,68px);font-weight:800;padding:8px 18px;border-radius:14px}
.word.pop{animation:pop .2s}@keyframes pop{from{transform:scale(.9);opacity:.4}}
.word.g{background:#16a34a}.word.b{background:var(--red)}
.word .gap{color:#ffd400;border-bottom:4px solid #ffd400;padding:0 4px}
.stage{background:#fff;border-radius:18px;padding:26px 30px;min-width:min(80vw,340px)}
.sw{font:800 clamp(34px,8vw,60px) Inter}
.pad{width:min(86vw,520px);height:min(46vh,320px);border:0;border-radius:24px;background:#fff;color:var(--blue);font:800 clamp(28px,7vw,60px) Inter;cursor:pointer}
.pad:active{background:#dbe7f7}
.typebox{width:min(94vw,820px);display:flex;flex-direction:column;gap:12px}
.tt{background:#fff;color:#7a8699;border-radius:16px;padding:18px 20px;font-size:clamp(18px,2.4vw,22px);line-height:1.6;text-align:left;margin:0}
.tt .ok{color:#0f1a2b}.tt .no{color:#fff;background:var(--red);border-radius:3px}
.tt .cur{box-shadow:inset 0 -3px 0 var(--blue)}
.typebox textarea{font:18px/1.5 Inter;border-radius:14px;border:0;padding:14px;resize:none;width:100%}
.dots{width:min(94vw,640px);aspect-ratio:400/260;background:rgba(255,255,255,.08);border-radius:16px}
.sch{grid-template-columns:repeat(5,minmax(0,1fr));width:min(90vw,420px);gap:8px}
.sc{aspect-ratio:1;border:0;border-radius:10px;background:#fff;color:var(--blue);font:800 clamp(18px,5vw,28px) Inter;cursor:pointer}
.sc.done{opacity:.3}.sc.x,.lt.x{background:var(--red);color:#fff}
.gng{width:min(46vw,180px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.1)}
.gng.go{background:#22c55e}.gng.no{background:var(--red)}.gng.hit{background:#fff}.gng.bad{background:#000}
.btn.on{background:#ffd400}
.mot{position:relative;width:min(92vw,640px);height:min(48vh,360px);background:rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
.ball{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;border:0;padding:0;background:#fff;cursor:pointer}
.ball.tg{background:#ffd400}.ball.no{background:var(--red)}
.shp{width:min(40vw,200px);height:min(40vw,200px);background:rgba(255,255,255,.08);border-radius:16px}
.track{position:relative;width:min(90vw,640px);height:56px;background:rgba(255,255,255,.12);border-radius:12px}
.tl{position:absolute;top:-8px;bottom:-8px;width:4px;margin-left:-2px;background:#ffd400}
.mk{position:absolute;top:8px;bottom:8px;width:8px;margin-left:-4px;background:#fff;border-radius:4px}
.ang{width:min(70vw,260px);height:min(70vw,260px)}
.srch{grid-template-columns:repeat(8,minmax(0,1fr));width:min(94vw,560px);gap:4px}
.lt{min-height:44px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font:600 clamp(20px,5vw,28px) Inter;cursor:pointer}
.fnd{font-size:22px;color:#ffd400}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(24px,4vw,56px);align-items:start}
.world h2{font-size:22px;margin:0 0 8px}.world>p{margin:0 0 12px}
.hrow.wr{grid-template-columns:9.5em minmax(0,1fr) auto}.wr span:first-child{overflow-wrap:normal;hyphens:auto;line-height:1.3}
.wr.ext i{background:#8a97ab!important}.wr.you i{background:var(--red)!important}.wr.you,.wr.mine{font-weight:700}
.wr.mine i{box-shadow:0 0 0 3px light-dark(#ffd400,#ffd400)}
.agein{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-weight:600}
.agein input{width:6em;font:16px Inter;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.src{font-size:13px;color:var(--mut)}
.pform{display:grid;gap:16px;max-width:640px}.pform h2{margin:0;font-size:24px}
.pform label{display:grid;gap:6px;font-weight:600}
.pform input:not([type=checkbox]),.pform select{font:16px Inter;padding:12px;min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.pform label.chk,label.chk{display:flex;align-items:center;gap:10px;font-weight:400;min-height:36px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--blue)}
fieldset{border:2px solid var(--line);border-radius:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:4px 14px;padding:12px 14px}
legend{font-weight:600;padding:0 6px}
.err{color:var(--red);font-weight:600;margin:0}.arena .err{color:#ffd400}
.pinrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pinrow input{width:9em;font:16px Inter;padding:12px;min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.arena .pinrow input{border:0;background:#fff;color:var(--blue)}
.ptop{background:var(--card);padding:12px max(5vw,16px);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:600}
.dz summary{cursor:pointer;font-weight:600;color:var(--mut);min-height:44px;display:flex;align-items:center}
table.res{border-collapse:collapse;width:100%;font-size:15px}
.res th,.res td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.res th{font-size:13px;color:var(--mut);font-weight:600}.res .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
textarea.cp{width:100%;min-height:120px;margin-top:10px;font:14px Inter;border-radius:10px;padding:10px}
.cert{background:#fff;color:#0f1a2b;border-radius:18px;padding:clamp(20px,4vw,44px);max-width:780px;margin:0 auto;border:8px solid var(--blue);box-shadow:inset 0 0 0 3px var(--red)}
.cert .res th,.cert .res td{border-color:#dfe4ec}.cert .res th{color:#5a6678}
.ch{display:flex;align-items:center;gap:10px;font:800 18px Inter}
.ctag{margin:18px 0 0;color:var(--red);font-weight:700}
.cname{font:800 clamp(30px,5vw,46px)/1.1 Inter;margin:6px 0 10px}
.code{font:700 18px ui-monospace,Menlo,monospace;letter-spacing:.06em}
.cnote{font-size:13px;color:#5a6678}
.intro p{max-width:46ch;margin:0 auto 18px;opacity:.9}
.hist h2{font-size:22px;margin:0 0 12px}
.hrow{display:grid;grid-template-columns:3em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.hrow i{display:block;height:12px;border-radius:6px;background:var(--blue)}
:root:not([data-theme=light]) .hrow i{background:light-dark(var(--blue),#5b8fd6)}
.hrow i.b{background:var(--red)}
.hrow span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.mut{color:var(--mut)}
.foot{font-size:14px;color:var(--mut);border-top:1px solid var(--line)}
@media(max-width:600px){.hero::after{width:200px;height:200px;border-width:28px;right:-70px;bottom:-90px}.arena{padding-top:56px}}
@media(prefers-reduced-motion:reduce){.card,.word.pop,.arena.bad{transition:none;animation:none}}
</style>
</head>

<script>
{
const app=document.getElementById('app');
const store={get(k){try{return JSON.parse(localStorage.getItem('hb-'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('hb-'+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang')==='cz'?'cz':'sk';
let T=[];
const later=(f,ms)=>{const id=setTimeout(f,ms);T.push(id);return id};
const cleanup=()=>{T.forEach(clearTimeout);T=[];running=false};
/* anti-cheat: flags collected during one run */
let running=false,flags=new Set();
const flag=k=>{if(running)flags.add(k)};
const gaps=ts=>ts.slice(1).map((t,i)=>t-ts[i]);
const cv=xs=>{if(xs.length<2)return 1;const m=xs.reduce((a,b)=>a+b,0)/xs.length;const sd=Math.sqrt(xs.reduce((a,b)=>a+(b-m)**2,0)/xs.length);return m?sd/m:0};
const away=()=>flag('blur');
window.addEventListener('blur',away);
document.addEventListener('visibilitychange',()=>{if(document.hidden)away()});
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=x=>{x=x.slice();for(let i=x.length-1;i>0;i--){const j=R(0,i);[x[i],x[j]]=[x[j],x[i]]}return x};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Q=(a,s)=>a.querySelector(s);
const L=o=>o[lang];

function advance(t){P.k++;
 if(P.k<EV.tries){P.ph='between';return step()}
 const r=P.res[t.id],vs=r.tries.filter(x=>x.ok).map(x=>x.v);

 P.ti++;P.k=0;P.pr=false;P.note=ps('lastRes')+' ('+L(t.name)+'): '+fmt(t,r.final);
 if(P.ti<EV.tests.length){P.ph='intro';return step()}
 done2()}

async function codeOf(o){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(o)));const h=[...new Uint8Array(b)].slice(0,5).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();return h.slice(0,5)+'-'+h.slice(5)}catch(e){return o.id.toString(36).toUpperCase()}}

 const rec={id:P.id,ev:EV.id,evName:EV.name,place:EV.place,proctor:EV.proctor,date:P.date,name:P.name,by:P.by,age:P.age,idOk:P.idOk,nav:P.nav,
  res:Object.fromEntries(Object.entries(P.res).map(([k,r])=>[k,{final:r.final,tries:r.tries.map(x=>({v:x.v,fl:x.fl,ok:x.ok}))}]))};
 rec.code=await codeOf(rec);store.set('sessions',[...sessions(),rec]);P=null;cert(rec)}

 if(!ME)h+=`<p><a href="index.html">${rs('loginCmp')}</a></p>`;
 else if(d.my_best!=null){
  if(n>=MINP){const p=Math.round((+d.worse+0.5*+d.equal)/(n-1)*100);h+=`<p class=pct><b>${rs('pctTxt').replace('{p}',p)}</b>${+d.equal?' · '+rs('eqTxt').replace('{e}',d.equal):''}</p>`}
  else h+=`<p class=mut>${rs('fewPlayers').replace('{n}',n).replace('{m}',MINP)}</p>`}
 const gs=(d.groups||[]).slice().sort((a,b)=>AGEG.indexOf(a.g)-AGEG.indexOf(b.g));
 if(gs.length){const myG=ME?ageGroup(ME.birth_year):null,mx=Math.max(...gs.map(g=>+g.median),1);
  h+=`<h3>${rs('byAge')}</h3>${gs.map(g=>`<div class="hrow wr ${g.g===myG?'mine':''}"><span>${esc(g.g)} <small class=mut>(${+g.n})</small></span><i style="width:${Math.max(2,+g.median/mx*100)}%"></i><span>${fmt(t,r1(+g.median))}</span></div>`).join('')}`}
 else if(n)h+=`<p class=mut>${rs('ageNote')}</p>`;
 h+=`<p><a href="index.html?sport=${encodeURIComponent(s.id)}">${rs('board')} →</a></p>`;
 return h}

function route(){const id=location.hash.slice(1);
 if(P&&!P.done&&id!=='dohlad'){P.nav++;location.hash='dohlad';return}
 if(id==='dohlad'){proctor();window.scrollTo(0,0);return}
 const t=visibleTests().find(x=>x.id===id);t?openTest(t):home();window.scrollTo(0,0)}

function setLang(l){lang=l;store.set('lang',l);document.documentElement.lang=l==='cz'?'cs':'sk';document.title=tx('title')+' · Porovnaj sa';
 document.getElementById('logoT').textContent=tx('title');document.getElementById('allT').textContent='🧠 '+tx('back');renderAuth();document.getElementById('foot').textContent=tx('foot');
 document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l))}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{setLang(b.dataset.l);route()});
window.addEventListener('hashchange',route);
setLang(lang);route();initRemote();
}
</script>
