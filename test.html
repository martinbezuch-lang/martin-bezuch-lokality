<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test prihlásenia</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#111827; --mut:#6b7280; --line:#d1d5db; --acc:#2563eb; --err:#b91c1c; --ok:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b22; --fg:#e5e7eb; --mut:#9ca3af; --line:#374151; --acc:#60a5fa; --err:#f87171; --ok:#4ade80; } }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:460px; margin:0 auto; padding:24px 16px 64px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:16px; }
  h1 { font-size:1.3rem; margin:0 0 4px; } h2 { font-size:1.05rem; margin:0 0 10px; }
  label { display:block; font-size:.85rem; color:var(--mut); margin:10px 0 3px; }
  input, select { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:transparent; color:inherit; font:inherit; }
  input[type=checkbox] { width:auto; margin-right:8px; }
  .chk { display:flex; align-items:flex-start; font-size:.9rem; color:var(--fg); margin-top:14px; }
  button { margin-top:14px; padding:10px 14px; border:0; border-radius:9px; background:var(--acc); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.sec { background:transparent; color:var(--acc); border:1px solid var(--line); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  #msg { margin-top:14px; font-size:.9rem; min-height:1.3em; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  .hide { display:none; } small, .mut { color:var(--mut); }
</style>
</head>
<body>
<main>
  <h1>Test prihlásenia</h1>
  <small>Skúšobná stránka. Hlavný web sa tým nemení.</small>
  <div id="msg" role="status"></div>

  <section id="v-auth" class="card hide">
    <h2>Prihlásenie</h2>
    <label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="email">
    <label for="l-pass">Heslo</label><input id="l-pass" type="password" autocomplete="current-password">
    <div class="row"><button id="b-login">Prihlásiť</button><button id="b-forgot" class="sec">Zabudnuté heslo</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
    <h2>Nová registrácia</h2>
    <label for="r-name">Meno, ktoré uvidia ostatní</label><input id="r-name" type="text" maxlength="60" autocomplete="nickname">
    <label for="r-email">E-mail (nikde sa nezobrazuje)</label><input id="r-email" type="email" autocomplete="email">
    <label for="r-pass">Heslo (min. 8 znakov)</label><input id="r-pass" type="password" minlength="8" autocomplete="new-password">
    <button id="b-reg">Registrovať</button>
  </section>

  <section id="v-reset" class="card hide">
    <h2>Nové heslo</h2>
    <label for="n-pass">Nové heslo (min. 8 znakov)</label><input id="n-pass" type="password" minlength="8" autocomplete="new-password">
    <button id="b-newpass">Uložiť heslo</button>
  </section>

  <section id="v-profile" class="card hide">
    <h2>Dokonči profil</h2>
    <label for="p-name">Meno</label><input id="p-name" type="text" maxlength="60">
    <label for="p-country">Krajina</label><input id="p-country" type="text" value="Slovensko" maxlength="80">
    <label for="p-gender">Pohlavie</label>
    <select id="p-gender"><option value="M">Muž</option><option value="Z">Žena</option></select>
    <label for="p-year">Rok narodenia</label><input id="p-year" type="number" min="1900" max="2100">
    <label for="p-weight">Váha (kg)</label><input id="p-weight" type="number" min="20" max="400" step="0.1">
    <label for="p-height">Výška (cm)</label><input id="p-height" type="number" min="80" max="260" step="0.1">
    <label class="chk"><input id="p-show" type="checkbox" checked><span>Zobraziť rok narodenia, váhu a výšku verejne</span></label>
    <label class="chk"><input id="p-consent" type="checkbox"><span>Súhlasím so spracovaním svojich osobných údajov na účely zobrazenia v rebríčkoch. Súhlas môžem kedykoľvek odvolať zmazaním účtu.</span></label>
    <button id="b-profile">Uložiť</button>
  </section>

  <section id="v-me" class="card hide">
    <h2>Si prihlásený</h2>
    <div id="me-info"></div>
    <h2 style="margin-top:16px">Disciplíny z databázy</h2>
    <div id="sports" class="mut"></div>
    <button id="b-out" class="sec">Odhlásiť</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://khduswpbhozkqjxnqufk.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_BKRTmdqqNQ7ELeKSRLsUAA_b59jHdx8';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var $ = function (id) { return document.getElementById(id); };
  var here = location.origin + location.pathname;
  var recovery = false;

  function say(text, ok) { var m = $('msg'); m.textContent = text || ''; m.className = ok ? 'ok' : 'err'; }
  function show(id) { ['v-auth','v-reset','v-profile','v-me'].forEach(function (v) { $(v).classList.toggle('hide', v !== id); }); }
  function num(v) { return v === '' ? null : Number(v); }

  async function render(session) {
    if (recovery) { show('v-reset'); return; }
    if (!session) { show('v-auth'); return; }
    var res = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if (res.error) { say('Profil sa nepodarilo načítať: ' + res.error.message); show('v-auth'); return; }
    var p = res.data;
    if (!p.consent_at) { $('p-name').value = p.display_name || ''; show('v-profile'); return; }
    var info = $('me-info'); info.textContent = '';
    [['Meno', p.display_name], ['E-mail', session.user.email], ['Krajina', p.country], ['Rola', p.role]].forEach(function (r) {
      var d = document.createElement('div'); d.textContent = r[0] + ': ' + r[1]; info.appendChild(d);
    });
    var s = await sb.from('sports').select('name,unit').order('sort_order');
    $('sports').textContent = s.error ? 'Chyba: ' + s.error.message : s.data.map(function (x) { return x.name + ' (' + x.unit + ')'; }).join(', ');
    show('v-me');
  }

  $('b-reg').onclick = async function () {
    var name = $('r-name').value.trim();
    if (name.length < 2) return say('Zadaj meno (aspoň 2 znaky).');
    if ($('r-pass').value.length < 8) return say('Heslo musí mať aspoň 8 znakov.');
    var r = await sb.auth.signUp({ email: $('r-email').value.trim(), password: $('r-pass').value,
      options: { data: { display_name: name }, emailRedirectTo: here } });
    if (r.error) return say('Registrácia zlyhala: ' + r.error.message);
    if (r.data.session) say('Registrácia prebehla.', true);
    else say('Poslali sme ti e-mail. Klikni na odkaz v ňom a potvrď registráciu.', true);
  };
  $('b-login').onclick = async function () {
    var r = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
    if (r.error) return say('Prihlásenie zlyhalo: ' + r.error.message);
    say('');
  };
  $('b-forgot').onclick = async function () {
    var email = $('l-email').value.trim();
    if (!email) return say('Zadaj e-mail do poľa vyššie.');
    var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: here });
    if (r.error) return say('Nepodarilo sa odoslať: ' + r.error.message);
    say('Ak e-mail existuje, poslali sme naň odkaz na obnovu hesla.', true);
  };
  $('b-newpass').onclick = async function () {
    if ($('n-pass').value.length < 8) return say('Heslo musí mať aspoň 8 znakov.');
    var r = await sb.auth.updateUser({ password: $('n-pass').value });
    if (r.error) return say('Heslo sa nepodarilo zmeniť: ' + r.error.message);
    recovery = false; say('Heslo bolo zmenené.', true);
    var s = await sb.auth.getSession(); render(s.data.session);
  };
  $('b-profile').onclick = async function () {
    if (!$('p-consent').checked) return say('Bez súhlasu sa nedá pokračovať.');
    var r = await sb.rpc('complete_profile', {
      p_display_name: $('p-name').value, p_country: $('p-country').value, p_gender: $('p-gender').value,
      p_birth_year: num($('p-year').value), p_weight_kg: num($('p-weight').value), p_height_cm: num($('p-height').value),
      p_show_body_data: $('p-show').checked, p_consent: true
    });
    if (r.error) return say('Uloženie zlyhalo: ' + r.error.message);
    say('Profil uložený.', true);
    var s = await sb.auth.getSession(); render(s.data.session);
  };
  $('b-out').onclick = async function () { await sb.auth.signOut(); say('Odhlásený.', true); };

  sb.auth.onAuthStateChange(function (event, session) {
    if (event === 'PASSWORD_RECOVERY') recovery = true;
    setTimeout(function () { render(session); }, 0);
  });
  sb.auth.getSession().then(function (r) { render(r.data.session); });
})();
</script>
</body>
</html>
